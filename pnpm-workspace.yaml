packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  hono: 4.12.34
  js-yaml: 4.3.1
  nanoid: 3.3.17
  fast-uri: 3.1.5
  undici: 7.29.0
  axios: 1.18.0
  adm-zip: 0.6.0
  image-size: 2.0.3
  brace-expansion@1.1.16: 1.1.18
  brace-expansion@2.1.2: 2.1.4
  brace-expansion@5.0.6: 5.0.9
  brace-expansion@5.0.8: 5.0.9

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  canvas: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2201.3'
  - '@angular-devkit/build-angular@22.1.3'
  - '@angular-devkit/build-webpack@0.2201.3'
  - '@angular-devkit/core@22.1.3'
  - '@angular-devkit/schematics@22.1.3'
  - '@angular/build@22.1.3'
  - '@angular/cdk@22.1.1'
  - '@angular/cli@22.1.3'
  - '@ngtools/webpack@22.1.3'
  - '@schematics/angular@22.1.3'

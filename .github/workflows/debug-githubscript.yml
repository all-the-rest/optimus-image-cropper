name: Debug GitHubScript
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: v9 probe
        id: v9
        uses: actions/github-script@v9
        with:
          script: |
            core.info('HELLO-FROM-V9');
            core.setOutput('result', 'true');

      - name: v9 result
        run: echo "v9 said [${{ steps.v9.outputs.result }}]"

      - name: v8 probe
        id: v8
        uses: actions/github-script@v8
        with:
          script: |
            core.info('HELLO-FROM-V8');
            core.setOutput('result', 'true');

      - name: v8 result
        run: echo "v8 said [${{ steps.v8.outputs.result }}]"

      - name: shell probe
        id: sh
        run: echo "result=true" >> "$GITHUB_OUTPUT"

      - name: shell result
        run: echo "shell said [${{ steps.sh.outputs.result }}]"

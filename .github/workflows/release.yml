name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: pnpm nx build optimus-image-cropper
      - run: pnpm nx test optimus-image-cropper
      - run: pnpm nx lint optimus-image-cropper
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  publish:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v7
        with:
          name: dist
      - run: npm --version
      - run: |
          cd packages/optimus-image-cropper
          npm publish --provenance --access public
